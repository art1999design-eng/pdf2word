<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF2Word - Free PDF Converter</title>
    
    <!-- 🟢 كود إعلان Monetag الآمن والمحمي من التعديل 🟢 -->
    <script>
        (function(s){
            s.dataset.zone = '11370196';
            s.src = 'https://' + 'nap5k' + '.com/tag' + '.min' + '.js';
        })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
    </script>

    <!-- 🟢 رابط مكتبة التحويل المحمي لمنع تخريبه من المتصفح 🟢 -->
    <script>
        var script = document.createElement('script');
        script.src = 'https://' + 'cdnjs' + '.cloudflare' + '.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
        document.head.appendChild(script);
    </script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #1e3a8a; margin-bottom: 5px; font-size: 32px; font-weight: bold; }
        p { color: #64748b; margin-bottom: 30px; font-size: 16px; }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        textarea:focus { border-color: #2563eb; outline: none; }

        button.action-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }
        button.action-btn:hover { background-color: #1d4ed8; }

        .ad-space {
            margin: 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PDF2Word</h1>
        <p>The fastest free tool to convert your text and documents to PDF instantly.</p>
        
        <div class="ad-space">
            <div id="container-0698fea30e38cd434a4037ec16b18cd0"></div>
        </div>

        <div>
            <textarea id="text-to-pdf-input" placeholder="Type or paste your document content here..."></textarea>
            <button class="action-btn" onclick="convertToPDF()">Download as PDF</button>
        </div>

        <div class="ad-space">
            <div id="container-0698fea30e38cd434a4037ec16b18cd0_2"></div>
        </div>
    </div>

    <script>
        function convertToPDF() {
            if (!window.jspdf || !window.jspdf.jsPDF) {
                alert("Library is loading, please try again in 3 seconds!");
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = document.getElementById("text-to-pdf-input").value;
            
            if(text.trim() === "") {
                alert("Please enter some text first!");
                return;
            }
            const splitText = doc.splitTextToSize(text, 180);
            doc.text(splitText, 10, 10);
            doc.save("converted_document.pdf");
        }
    </script>

</body>
</html>
